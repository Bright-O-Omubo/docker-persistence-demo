version: '3'
services:
  mongodb:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=passwd99

  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    depends_on:
      - mongodb
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=passwd99
      - ME_CONFIG_MONGODB_SERVER=mongodb

  profile-app:
    image: 153099270414.dkr.ecr.us-east-1.amazonaws.com/profile-app:1.0
    ports:
      - 3000:3000
    environment:
      - MONGO_URL=mongodb://admin:passwd99@mongodb:27017